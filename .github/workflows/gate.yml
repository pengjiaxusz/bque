name: gate

on:
  pull_request:
  merge_group:
  push:
    branches: [main, master]
  workflow_dispatch:

# Only the newest run per branch matters: an outdated run reports on a range that no longer exists.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The server-side counterpart of the local commit hooks. It needs nothing from the contributor's machine, so a pull request is checked even when the author never installed the CLI.
permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    # The name is a stable identifier on purpose: a required status check refers to it, and that reference must not break when the documentation language changes.
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pin latest major Action versions (Node 24 runtime, no Node 20 deprecation warnings); when adding project CI workflows, prefer `actions/checkout@v7`, `actions/cache@v6`, `Swatinem/rust-cache@v2` and `taiki-e/install-action@v2` with `concurrency` enabled.
      - uses: actions/checkout@v7
        with:
          # The full history is needed to walk the commit range, and the head ref keeps GitHub's auto-generated merge commit out of the range.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Checkout leaves submodules empty, so a project whose path dependencies live in a submodule cannot even load its workspace — and the failure surfaces as a missing dependency rather than a missing submodule. Harmless for projects without submodules.
          submodules: true

      # Keep `gate` running on every push/PR so the required status check never stalls, but skip Rust/code checks when the diff only touches docs.
      - name: Detect code changes
        id: changes
        env:
          GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="${GATE_BASE:-}"
          if printf '%s' "$base" | grep -qE '^0+$' || [ -z "$base" ] || ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null 2>&1; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base"..HEAD 2>/dev/null || true)
          if [ -z "$changed" ]; then
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code_changed=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/*|.agents/*|.github/pull_request_template.md|LICENSE*)
                ;;
              */*)
                code_changed=true
                break
                ;;
              *.md)
                ;;
              *)
                code_changed=true
                break
                ;;
            esac
          done <<EOF
          $changed
          EOF
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"

      - name: Install pengj-templates-cli
        run: |
          curl -fsSL https://github.com/pengjiaxusz/pengj-templates/releases/latest/download/install.sh | sh
          echo "${XDG_DATA_HOME:-$HOME/.local/share}/pengj-templates/bin" >> "$GITHUB_PATH"

      - name: Check the commit messages
        env:
          # The base of the range: the target branch for a pull request, the previous commit for a push.
          GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="${GATE_BASE:-}"
          # An all-zero base is a branch deletion, and after a force-push the base can point at a commit that no longer exists; both fall back to running without a base, otherwise `git log` errors out and the gate fails for a reason unrelated to the commits.
          if printf '%s' "$base" | grep -qE '^0+$' || { [ -n "$base" ] && ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null 2>&1; }; then
            base=""
          fi
          set +e
          if [ -n "$base" ]; then
            output=$(pengj-templates-cli gate check-commits --base "$base" 2>&1)
          else
            output=$(pengj-templates-cli gate check-commits 2>&1)
          fi
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            {
              echo "## The commit gate rejected this range"
              echo ""
              echo '```'
              printf '%s\n' "$output"
              echo '```'
              echo ""
              echo 'Every commit needs a subject of the form `type(scope): subject`. The rule set lives in `.pengj-templates/gate.toml`.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Run the code language guard
        if: steps.changes.outputs.code_changed == 'true'
        run: |
          set +e
          output=$(pengj-templates-cli gate check 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            {
              echo "## The code language guard reported violations"
              echo ""
              echo '```'
              printf '%s\n' "$output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Check the documentation language
        run: |
          set +e
          output=$(pengj-templates-cli check-lang --dir . 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            {
              echo "## The documentation language gate reported violations"
              echo ""
              echo '```'
              printf '%s\n' "$output"
              echo '```'
              echo ""
              echo 'English projects must have no Han characters; Chinese projects must have Chinese in human-facing copy. Fix the template and run `update`.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      # The local pre-commit hook formats the staged Rust files; without the CLI that never happens, so the server checks it.
      - name: Check the formatting
        if: steps.changes.outputs.code_changed == 'true'
        run: cargo fmt --check